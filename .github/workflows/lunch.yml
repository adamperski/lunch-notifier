name: Daily lunch menu
on:
  schedule:
    # GitHub's scheduler is UTC-only and sometimes late or skipped, so instead of sending at an
    # exact time, evening runs hand tomorrow's menu to ntfy for delivery at 6:30am Denver time.
    # Three evening tries (≈6–11pm Denver, Sun–Thu) for redundancy; duplicates are skipped.
    - cron: "17 1 * * 1-5"
    - cron: "17 3 * * 1-5"
    - cron: "17 5 * * 1-5"
    # Morning backup (≈6:45–7:45am Denver): sends right away only if nothing was sent.
    - cron: "47 13 * * 1-5"
  workflow_dispatch:      # manual run from the Actions tab
    inputs:
      when:
        description: "now = send today's menu immediately; schedule = queue tomorrow's for 6:30am"
        type: choice
        options: [now, schedule]
        default: now
  push:                   # test run whenever the code changes
    paths: ["lunch.py", ".github/workflows/lunch.yml"]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python lunch.py
        env:
          NTFY_TOPIC: foster-lunch-4906
          GRADE: "01"
          SEND_TIME: "06:30"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.when != 'schedule' && '1' || '' }}
          # Runs triggered by code changes don't send to the phone
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '' }}
